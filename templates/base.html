<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}MealMind{% endblock %}</title>
  <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@1.5.10/css/pico.min.css">
  <style>
    header { padding: .8rem 1rem; display:flex; justify-content:space-between; align-items:center; }
    header a.brand { font-weight:700; text-decoration:none; }
    main { padding: 1rem; }
    .btn { padding:.55rem 1rem; border-radius:.6rem }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('dashboard') }}">MealMind</a>
    {% if session.get('user') %}
      <nav><a class="btn" href="{{ url_for('logout') }}">Logout</a></nav>
    {% endif %}
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div>
          {% for category, message in messages %}
            <article class="{{ 'secondary' if category=='error' else 'primary' }}">{{ message }}</article>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
