<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}MealMind{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/mm2.png') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <style>
    body {
      background: #f3f4f8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
    }
    .topbar {
      background: #0f172a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 1.5rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: .5rem;
      text-decoration: none;
      color: #fff;
    }
    .brand img {
      height: 34px;
      width: 34px;
    }
    .btn-logout {
      background: #f97316;
      border: none;
      padding: .45rem 1rem;
      border-radius: .45rem;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    .content {
      padding: 1.5rem;
    }

    /* chat bubble */
    .chat-bubble {
      position: fixed;
      bottom: 1.2rem;
      right: 1.2rem;
      width: 54px;
      height: 54px;
      background: #2563eb;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      color: #fff;
      font-size: 1.6rem;
      z-index: 999;
    }
    .chat-panel {
      position: fixed;
      bottom: 5rem;
      right: 1.2rem;
      width: 280px;
      background: #fff;
      border-radius: .75rem;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 999;
    }
    .chat-panel header {
      background: #2563eb;
      color: #fff;
      padding: .5rem .75rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-body {
      padding: .5rem;
      max-height: 200px;
      overflow-y: auto;
      font-size: .85rem;
    }
    .chat-input {
      display: flex;
      gap: .25rem;
      padding: .5rem;
      border-top: 1px solid #e2e8f0;
    }
    .chat-input input {
      flex: 1;
      border: 1px solid #cbd5f5;
      border-radius: .35rem;
      padding: .25rem .4rem;
    }
    .chat-input button {
      border: none;
      background: #2563eb;
      color: #fff;
      border-radius: .35rem;
      padding: .25rem .6rem;
      cursor: pointer;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('dashboard') }}" class="brand">
      <img src="{{ url_for('static', filename='img/mealmind-mark.svg') }}" alt="MealMind">
      <span>MealMind</span>
    </a>
    {% if current_user %}
      <div style="display:flex; gap:1rem; align-items:center;">


        
        <a href="{{ url_for('logout') }}" class="btn-logout">Logout</a>
      </div>
    {% endif %}
  </header>

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  <!-- floating chat -->
  <div class="chat-bubble" id="chatToggle">💬</div>
  <div class="chat-panel" id="chatPanel">
    <header>
      <span>MealMind chat</span>
      <button style="background:none;border:none;color:#fff;font-weight:bold;cursor:pointer" onclick="toggleChat()">×</button>
    </header>
    <div class="chat-body" id="chatBody">
      <div><strong>Bot:</strong> Hi! Ask me anything.</div>
    </div>
    <div class="chat-input">
      <input id="chatMsg" placeholder="Type here..." />
      <button onclick="sendChat()">Send</button>
    </div>
  </div>

  <script>
    const chatToggle = document.getElementById('chatToggle');
    const chatPanel  = document.getElementById('chatPanel');
    const chatBody   = document.getElementById('chatBody');
    const chatMsg    = document.getElementById('chatMsg');

    function toggleChat() {
      chatPanel.style.display = (chatPanel.style.display === 'flex') ? 'none' : 'flex';
      chatPanel.style.flexDirection = 'column';
    }
    chatToggle.addEventListener('click', toggleChat);

    async function sendChat() {
      const text = chatMsg.value.trim();
      if (!text) return;
      chatBody.innerHTML += `<div><strong>You:</strong> ${text}</div>`;
      chatMsg.value = '';
      chatBody.scrollTop = chatBody.scrollHeight;
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: text})
        });
        const data = await res.json();
        chatBody.innerHTML += `<div><strong>Bot:</strong> ${data.reply}</div>`;
      } catch (err) {
        chatBody.innerHTML += `<div><strong>Bot:</strong> Server error.</div>`;
      }
      chatBody.scrollTop = chatBody.scrollHeight;
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
