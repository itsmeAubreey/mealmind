<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}MealMind{% endblock %}</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <style>
      :root {
        --nav-bg: #0f192b;
        --page-bg: #f3f4f8;
      }
      body {
        margin:0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--page-bg);
      }
      .topbar {
        background: var(--nav-bg);
        color: #fff;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        box-sizing: border-box;
      }
      .brand {
        display:flex;
        align-items:center;
        gap:10px;
      }
      .brand img {
        height:34px;
      }
      .top-right {
        display:flex;
        align-items:center;
        gap:14px;
        font-size: 13px;
      }
      .logout-btn {
        background:#f97316;
        color:#fff;
        border:none;
        padding:6px 14px;
        border-radius:9999px;
        cursor:pointer;
        font-weight:600;
      }
      .page-wrap {
        padding: 20px 30px 70px;
      }

      /* floating chatbot */
      #chat-button {
        position: fixed;
        bottom: 22px;
        right: 22px;
        z-index: 999;
        width: 52px;
        height: 52px;
        border-radius: 9999px;
        border: none;
        background: #2563eb;
        color: #fff;
        font-size: 26px;
        cursor: pointer;
        box-shadow: 0 12px 28px rgba(0,0,0,0.2);
      }
      #chat-window {
        position: fixed;
        bottom: 84px;
        right: 22px;
        width: 290px;
        height: 360px;
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 12px 28px rgba(0,0,0,0.12);
        display: none;
        flex-direction: column;
        overflow: hidden;
        z-index: 999;
      }
      #chat-header {
        background: #2563eb;
        color: #fff;
        padding: 10px 14px;
        display:flex;
        justify-content: space-between;
        align-items: center;
      }
      #chat-body {
        flex:1;
        padding: 10px 12px;
        font-size: 13px;
      }
      #chat-input {
        border-top: 1px solid #eee;
        padding: 6px;
      }
      #chat-input input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
      }
    </style>

    {% block head %}{% endblock %}
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="{{ url_for('static', filename='logo.svg') }}" alt="MealMind">
        <strong>MealMind</strong>
      </div>
      <div class="top-right">
        {% if session.get('user') %}
          <span>Welcome, {{ session.get('user') }}</span>
        {% endif %}
        <form action="{{ url_for('logout') }}" method="post" style="margin:0;">
          <button class="logout-btn" type="submit">Logout</button>
        </form>
      </div>
    </header>

    <main class="page-wrap">
      {% block content %}{% endblock %}
    </main>

    <!-- floating chatbot -->
    <button id="chat-button" title="Chat">💬</button>
    <div id="chat-window">
      <div id="chat-header">
        <span>MealMind Assistant</span>
        <button onclick="toggleChat()" style="background:none;border:none;color:#fff;font-size:16px;cursor:pointer;">×</button>
      </div>
      <div id="chat-body">
        <p><strong>Hi!</strong> Chatbot placeholder.</p>
        <p>You can wire this to Azure OpenAI later.</p>
      </div>
      <div id="chat-input">
        <input type="text" placeholder="Type a message…" disabled>
      </div>
    </div>

    <script>
      const chatBtn = document.getElementById('chat-button');
      const chatWin = document.getElementById('chat-window');

      function toggleChat() {
        if (chatWin.style.display === 'flex') {
          chatWin.style.display = 'none';
        } else {
          chatWin.style.display = 'flex';
        }
      }

      chatBtn.addEventListener('click', toggleChat);
    </script>
  </body>
</html>
