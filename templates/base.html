<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MealMind</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #f4f5f9;
        --nav: #0f172a;
        --card: #ffffff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
      }
      header {
        height: 54px;
        background: var(--nav);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.5rem;
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.05em;
      }
      .brand a {
        color: #fff;
        text-decoration: none;
      }
      .top-right {
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }
      .logout-btn {
        background: #f97316;
        color: #fff;
        padding: 0.35rem 0.85rem;
        border-radius: 9999px;
        font-size: 0.7rem;
        text-decoration: none;
      }
      main {
        max-width: 1240px;
        margin: 1.5rem auto 2.5rem;
        padding: 0 1rem;
      }
      .flash {
        background: #fff;
        border-left: 4px solid #0f766e;
        padding: 0.5rem 0.8rem;
        border-radius: 0.4rem;
        margin-bottom: 0.7rem;
        font-size: 0.78rem;
      }
      .flash.error {
        border-left-color: #dc2626;
      }
      a { color: #0f766e; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><a href="{{ url_for('dashboard') }}">MealMind</a></div>
      {% if current_user %}
        <div class="top-right">
          <a class="logout-btn" href="{{ url_for('logout') }}">Logout</a>
        </div>
      {% endif %}
    </header>
    <main>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
