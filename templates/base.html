<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}MealMind{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --mm-blue:#0B63F6;
      --mm-surface:#0e1116;
      --mm-bg:#f5f7fb;
      --card-radius:18px;
      --shadow:0 10px 30px rgba(20,30,60,.12);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";
      background:#f7f9fc;
      color:#0b1220;
    }

    /* Top bar */
    .mm-topbar{
      position:sticky; top:0; z-index:50;
      height:64px; width:100%;
      background:var(--mm-blue);
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 2px 10px rgba(0,0,0,.12);
    }
    .mm-topbar-inner{
      width:min(1200px,92vw);
      display:flex; align-items:center; justify-content:space-between;
    }
    .mm-brand{
      display:inline-flex; gap:.6rem; align-items:center; text-decoration:none;
      color:#fff; font-weight:700; letter-spacing:.2px; font-size:1.25rem;
    }
    .mm-logo{
      width:32px;height:32px;border-radius:9px;
      background:#0ad49c; display:grid; place-items:center; color:#083b28; font-weight:900;
      box-shadow:inset 0 -5px 10px rgba(0,0,0,.15);
    }
    .mm-logout{
      appearance:none;border:0;border-radius:12px;padding:.55rem .9rem;
      background:#ffffff; color:#0b1220; font-weight:600; cursor:pointer;
      box-shadow:var(--shadow); display:inline-flex; align-items:center; gap:.5rem;
    }
    .mm-logout:hover{filter:brightness(.97)}

    /* Page container */
    .mm-wrap{width:min(1200px,92vw); margin:28px auto}
    @media (max-width:900px){ .mm-wrap{width:min(1100px,94vw);} }

    /* Generic helpers */
    .muted{opacity:.7}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    {% block head_extra %}{% endblock %}
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header class="mm-topbar">
    <div class="mm-topbar-inner">
      <a class="mm-brand" href="{{ url_for('dashboard') }}">
        <span class="mm-logo">M</span>
        <span>MealMind</span>
      </a>
      {% if session.get('user_id') %}
        <form action="{{ url_for('logout') }}" method="post" style="margin:0">
          <button class="mm-logout" type="submit">↪ Logout</button>
        </form>
      {% else %}
        <span></span>
      {% endif %}
    </div>
  </header>

  <main class="mm-wrap">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
