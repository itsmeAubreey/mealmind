<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Kitchen Assistant · MealMind</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#fff;}
    header{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid #eee;}
    a.btn{padding:8px 12px;border:1px solid #ddd;border-radius:10px;text-decoration:none;color:#111}
    .wrap{max-width:920px;margin:28px auto;padding:0 16px;}
    .chat{border:1px solid #eee;border-radius:16px;padding:16px;min-height:320px}
    .row{margin-bottom:12px}
    .role{font-size:12px;opacity:.7;margin-bottom:4px}
    .bubble{background:#f7f7f8;border-radius:12px;padding:10px}
    .me .bubble{background:#e7f1ff}
    .controls{display:flex;gap:8px;margin-top:12px}
    textarea{flex:1;min-height:64px;padding:10px;border-radius:10px;border:1px solid #ddd}
    button{padding:10px 14px;border:1px solid #111;background:#111;color:#fff;border-radius:10px;cursor:pointer}
    .warn{background:#fff4e5;border:1px solid #ffd7a0;color:#8a4b00;padding:10px;border-radius:10px;margin-bottom:16px}
  </style>
</head>
<body>
  <header>
    <div><strong>Kitchen Assistant</strong></div>
    <nav>
      <a class="btn" href="/dashboard">Back to Dashboard</a>
    </nav>
  </header>

  <div class="wrap">
    {% if not assistant_ready %}
      <div class="warn">
        Assistant is not fully configured. Add AZURE_OPENAI_* environment variables in Azure App Service Settings.
      </div>
    {% endif %}

    <div id="chat" class="chat"></div>

    <div class="controls">
      <textarea id="msg" placeholder="Ask about menu planning, substitutions, allergies, inventory ideas…"></textarea>
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const msg = document.getElementById('msg');
    const send = document.getElementById('send');

    const history = [];

    function addRow(role, text){
      const row = document.createElement('div');
      row.className = 'row ' + (role === 'user' ? 'me' : 'ai');
      row.innerHTML = `
        <div class="role">${role === 'user' ? 'You' : 'Assistant'}</div>
        <div class="bubble">${text.replace(/</g,"&lt;")}</div>
      `;
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    async function callAssistant(userText){
      const res = await fetch('/api/chat', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ message: userText, history })
      });
      const data = await res.json();
      if(!data.ok){
        addRow('assistant', 'Error: ' + (data.error || 'Unknown error'));
        return;
      }
      history.push({role:'user', content:userText});
      history.push({role:'assistant', content:data.reply});
      addRow('assistant', data.reply);
    }

    send.addEventListener('click', () => {
      const text = msg.value.trim();
      if(!text) return;
      addRow('user', text);
      msg.value = '';
      callAssistant(text);
    });

    msg.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){
        send.click();
      }
    });
  </script>
</body>
</html>
