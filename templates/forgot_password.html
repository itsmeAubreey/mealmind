{% extends "base.html" %}
{% block title %}Forgot Password - MealMind{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1>Forgot password</h1>
    <p class="auth-subtitle">
      Enter your <strong>username or employee ID</strong>, your <strong>email</strong>,
      and choose a new password.
    </p>

    <form method="post" class="auth-form">
      <div class="form-group">
        <label>Username or Employee ID</label>
        <input
          type="text"
          name="identifier"
          class="form-control"
          value="{{ request.form.identifier or '' }}"
          autocomplete="off"
        >
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          name="email"
          class="form-control"
          value="{{ request.form.email or '' }}"
          autocomplete="off"
        >
      </div>

      <div class="form-group">
        <label>New password</label>
        <input
          type="password"
          name="password"
          class="form-control"
          autocomplete="new-password"
        >
      </div>

      <div class="form-group">
        <label>Confirm new password</label>
        <input
          type="password"
          name="confirm"
          class="form-control"
          autocomplete="new-password"
        >
      </div>

      <div class="auth-actions">
        <button type="submit" class="btn-primary">Update password</button>
        <a href="{{ url_for('login') }}" class="btn-link">Back to login</a>
      </div>
    </form>
  </div>
</div>

<style>
  .auth-page {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: calc(100vh - 64px);
    padding: 2.5rem 1.5rem;
    background: #f3f4f6;
  }
  .auth-card {
    width: 100%;
    max-width: 640px;
    background: #ffffff;
    border-radius: 1.25rem;
    padding: 2.25rem 2.5rem 2.5rem;
    box-shadow: 0 25px 60px rgba(15, 23, 42, 0.12);
  }
  .auth-card h1 {
    margin: 0 0 0.5rem;
    font-size: 1.6rem;
  }
  .auth-subtitle {
    margin: 0 0 1.5rem;
    font-size: 0.95rem;
    color: #6b7280;
  }
  .auth-form .form-group {
    margin-bottom: 1rem;
  }
  .auth-form label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.35rem;
    color: #4b5563;
  }
  .auth-form .form-control {
    width: 100%;
    border-radius: 0.5rem;
    border: 1px solid #d1d5db;
    padding: 0.55rem 0.7rem;
    font-size: 0.95rem;
  }
  .auth-actions {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.75rem;
  }
  .btn-primary {
    border: none;
    background: #059669;
    color: #fff;
    border-radius: 999px;
    padding: 0.55rem 1.4rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-link {
    font-size: 0.9rem;
    color: #2563eb;
    text-decoration: none;
  }
  .btn-link:hover {
    text-decoration: underline;
  }
</style>
{% endblock %}
